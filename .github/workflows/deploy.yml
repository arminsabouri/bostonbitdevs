name: Deploy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
defaults:
  run:
    shell: bash
jobs:
  all:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3.0.0
      # shortcut: templates fail on zola 0.23+ (Tera v2), unpin after migrating them.
      - run: |
          curl -sSfL https://github.com/getzola/zola/releases/download/v0.21.0/zola-v0.21.0-aarch64-apple-darwin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check
        run: |
          zola serve &
          sleep 1
          ./bin/check-links
          kill $(jobs -p)
      - run: zola build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/master'
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          publish_branch: gh-pages
          publish_dir: public
